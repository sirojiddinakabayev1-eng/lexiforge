async function loadM(){let rows=[];const now=new Date().toISOString();
 if(S.demo){rows=(LS('dm')||[]).filter(x=>x.expires_at>now)}
 else{const a=S.u.id,b=S.peer.id;const r=await sb.from('messages').select('*').or(`and(sender.eq.${a},receiver.eq.${b}),and(sender.eq.${b},receiver.eq.${a})`).gt('expires_at',now).order('created_at');rows=r.data||[];sb.from('messages').delete().lt('expires_at',now).eq('sender',a)}
 const el=$('#ml');if(!el)return;
 el.innerHTML=rows.map(x=>{const me=x.sender==S.u.id,md=S.modes[x.id]||'me',map=md=='me'?S.mine.map.includes(-1)?null:S.mine.map:md=='peer'?S.peerMap:null;
 return`<div class="msg ${me?'me':''}"><div class="mb">${(u=>show(u.a,map,u.lg))(unpack(x.body))}</div><div class="row sp"><small>${md}</small><span><button class="sm" onclick="sw('${x.id}')">${t('sw')}</button> <button class="sm" onclick="rep('${x.id}')">⚑</button></span></div></div>`}).join('')||`<p><small>⏳ 10 min</small></p>`;}
function sw(id){const o=['me','peer','plain'];S.modes[id]=o[(o.indexOf(S.modes[id]||'me')+1)%3];loadM()}
async function sendM(){if(!S.draft.length)return;const exp=new Date(Date.now()+6e5).toISOString();
 if(S.demo){const d=LS('dm')||[];d.push({id:Date.now(),sender:'demo',body:[100+L,...S.draft],expires_at:exp});LS('dm',d)}
 else{if(S.p.blocked)return alert('🚫');const r=await sb.from('messages').insert({sender:S.u.id,receiver:S.peer.id,body:[100+L,...S.draft],expires_at:exp});if(r.error)return alert(r.error.message)}
 S.draft=[];dr();loadM()}
async function rep(mid){const n=await dlg(T.report.split('|')[L],{opts:t('rs').split(',')});if(n==null)return;const r=['so‘kinish','haqorat','aldov','jinoiy'][n];
 if(S.demo)return alert('Demo');const e=await sb.rpc('report_chat',{p_reported:S.peer.id,p_msg:mid?+mid:null,p_reason:r});alert(e.error?e.error.message:'✅')}

 <div class="row" style="margin-top:8px">${S.u.email===ADMIN&&!S.demo?`<button class="p" onclick="go('admin')">🛡 ${t('adm')}</button>`:''}<button onclick="LS('pin',null);S.unlocked=false;alert(t('pr'))">PIN</button><button onclick="signOut()">${t('out')}</button></div></div>`}

 const a=x.reporter,b=x.reported,r=await sb.from('messages').select('*').or(`and(sender.eq.${a},receiver.eq.${b}),and(sender.eq.${b},receiver.eq.${a})`).order('created_at');
 $('#ml').innerHTML=(r.data||[]).map(m=>`<div class="msg ${m.sender==a?'me':''}"><small>${m.sender==a?E(x.rp?.name):E(x.rd?.name)}</small><br>${(u=>E(plain(u.a,u.lg)))(unpack(m.body))}</div>`).join('')||`<p>${t('none')}</p>`}
